
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktik Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <header class="bg-secondary text-white p-4">
        <h1 class="h3 m-0">Website Praktik</h1>
    </header>

    <nav class="bg-info text-white p-3">
        Navigasi
    </nav>

    <div class="container-fluid my-4">
        <div class="row min-vh-100">

            <aside class="col-md-3">
                <div class="bg-light border rounded p-3">
                    <h2>Menu</h2>

                    <ul class="list-group">
                        <li class="list-group-item">
                            <a href="Dashboard.html"
                                class="text-decoration-none text-black">
                                Dashboard
                            </a>
                        </li>

                        <li class="list-group-item">
                            <a href="buku.html"
                                class="text-decoration-none text-black">
                                Daftar Buku
                            </a>
                        </li>

                        <li class="list-group-item">
                            <a href="#"
                                class="text-decoration-none text-black">
                                Form Peminjam
                            </a>
                        </li>
                    </ul>
                </div>
            </aside>

            <main class="col-md-9">
                <section class="border rounded p-3">

                    <article class="m-4 border rounded p-3" id="article1">
                        <h1 class="h3 mb-2">Article 1</h1>
                        <p class="mb-3">Isinya</p>

                        <button class="btn btn-warning btn-sm"
                            onclick="editArticle('article1')">
                            Edit
                        </button>

                        <button class="btn btn-danger btn-sm"
                            onclick="deleteArticle('article1')">
                            Delete
                        </button>
                    </article>

                    <article class="m-4 border rounded p-3" id="article2">
                        <h1 class="h3 mb-2">Article 2</h1>
                        <p class="mb-3">Isinya</p>

                        <button class="btn btn-warning btn-sm"
                            onclick="editArticle('article2')">
                            Edit
                        </button>

                        <button class="btn btn-danger btn-sm"
                            onclick="deleteArticle('article2')">
                            Delete
                        </button>
                    </article>

                </section>
            </main>

        </div>
    </div>

    <footer class="bg-dark-subtle text-black text-center p-2 m-4">
        <p class="mb-0">
            Copyright &copy; 2023 Website Praktik. All rights reserved.
        </p>
    </footer>

    <script>
        // Fungsi Edit Artikel
        function editArticle(id) {
            let article = document.getElementById(id);

            let judul = article.querySelector("h1");
            let isi = article.querySelector("p");

            let judulBaru = prompt("Masukkan judul baru:", judul.innerText);

            if (judulBaru === null) {
                return;
            }

            let isiBaru = prompt("Masukkan isi artikel:", isi.innerText);

            if (isiBaru === null) {
                return;
            }

            judul.innerText = judulBaru;
            isi.innerText = isiBaru;
        }

        // Fungsi Delete Artikel
        function deleteArticle(id) {
            let konfirmasi = confirm("Apakah kamu yakin ingin menghapus artikel ini?");

            if (konfirmasi) {
                let article = document.getElementById(id);
                article.remove();

                alert("Artikel berhasil dihapus!");
            }
        }
    </script>

</body>
</html>
